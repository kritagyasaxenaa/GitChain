[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "gitchain"
version = "0.3.0"
description = "Git-backed chain node and FastAPI service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.0",
  "cryptography>=42",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[project.scripts]
gitchain = "gitchain.cli:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["gitchain"]