app = "gitchain"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  GOC_ENV = "development"
  GOC_ALLOW_INSECURE_BIND = "1"
  GOC_ROCKS_PATH = "/data/l1"
  GOC_CHAIN_ID = "L1"
  GOC_CHAIN_TYPE = "L1"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[mounts]
  source = "gitchain_data"
  destination = "/data/l1"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
